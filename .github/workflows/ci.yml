name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core deps only; torch is optional)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas matplotlib scikit-learn pytest hypothesis
          python -m pip install -e .
      - name: Run tests
        run: python -m pytest tests -q
      - name: Smoke-run two case studies
        run: python scripts/run_all.py case1 case2
