[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carfollowing"
version = "1.0.0"
description = "Car-following traffic modelling toolkit: 7 models, stability theory, calibration, prediction, lane changing and EV energy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Car-Following Modelling contributors" }]
keywords = [
    "traffic-flow", "car-following", "IDM", "stability", "calibration",
    "trajectory-prediction", "NGSIM", "MOBIL", "electric-vehicle", "energy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dl = ["torch>=2.0"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
